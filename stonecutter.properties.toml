dep.mixson.coords = "maven.modrinth:$id:$version"
required.mixson = "2.2.0"
required.defaulted = "1.3.8-26.1.2"
optional.taxfreelevels = "1.5.4"
optional.modestmagic = "1.4.1-26.1.2"
runtime.sodium = "0.9.2+mc26.2"

[fabric."26.2"]
