# general
mod.id = "simple_smithing_overhaul"
mod.name = "Simple Smithing Overhaul"
mod.group = "me.pajic"
mod.version = "2.9.13"
mod.description = "Portable item repair, enchantment upgrading, anvil improvements and more"
mod.authors = "pajic"
mod.contributors = "Lufurrius, Moonkey"
mod.license = "MIT"

# links
mod.sources_url = "https://github.com/pajicadvance/simple-smithing-overhaul"
mod.homepage_url = "https://modrinth.com/mod/simple-smithing-overhaul"
mod.issues_url = "https://github.com/pajicadvance/simple-smithing-overhaul/issues"
mod.discord_url = "https://discord.gg/5RkzS66zWb"

# publishing
publish.modrinth = "U5TJjZc3"
publish.curseforge = "1179744"
publish.env.mr = "CLIENT_AND_SERVER" #https://modmuss50.github.io/mod-publish-plugin/platforms/modrinth/#all-options
publish.env.cf.client = true
publish.env.cf.server = true
publish.dry_run = false

# loom
loomx.loom_version = "1.17-SNAPSHOT"

# dependencies
loader.fabric = "0.19.5"
dep.mixinconstraints.coords = "com.moulberry:$id:$version"
dep.fzzy_config.coords = "me.fzzyhmstrs:$id:$version"
dep.fzzy_config.slug = "fzzy-config"
dep.taxfreelevels.coords = "maven.modrinth:tax-free-levels:$version-$loader"
dep.penchant.coords = "maven.modrinth:$id:$version"
dep.enchantmentdisabler.coords = "maven.modrinth:enchantment-disabler:$version+$mc-$loader"
dep.modestmagic.coords = "maven.modrinth:modest-magic:$version-$loader"
dep.sodium.coords = "net.caffeinemc:$id-$loader:$version"
optional.enchantmentdisabler = "3.4.9"
include.mixinconstraints = "1.1.0"
dev.runtime_optionals = []

[fabric]
dep.fabric-api.coords = "net.fabricmc.fabric-api:$id:$version"
dep.modmenu.coords = "com.terraformersmc:$id:$version"
dep.defaulted.coords = "maven.modrinth:$id:$version-Fabric"
dep.defaulted.range = ">=1.3.8"
dep.modestmagic.range = ">=1.4.1"

[neoforge]
dep.defaulted.coords = "maven.modrinth:$id:$version-NeoForge"
dep.defaulted.range = "[1.3.8,)"
dep.modestmagic.range = "[1.4.1,)"


["1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]
loader.neo = "21.1.250"
dep.mixson.coords = "com.github:Mixson:$version"
include.mixson = "2.2.0"
required.defaulted = "1.3.8-1.21.1"
optional.modestmagic = "1.4.1-1.21.1"
runtime.sodium = "0.8.13+mc1.21.1"

[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
required.fabric-api = "0.116.17+1.21.1"
required.fzzy_config = "0.7.6+1.21"
optional.taxfreelevels = "1.4.24"
runtime.modmenu = "11.0.4"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21, 1.21.1]"
required.fzzy_config = "0.7.6+1.21+neoforge"
optional.taxfreelevels = "1.4.25"


["26.1"]
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]
loader.neo = "26.1.2.107"
dep.mixson.coords = "maven.modrinth:$id:$version"
required.mixson = "2.2.0"
required.defaulted = "1.3.8-26.1.2"
optional.taxfreelevels = "1.5.4"
optional.modestmagic = "1.4.1-26.1.2"
runtime.sodium = "0.9.2+mc26.1.2"

[fabric."26.1"]
mod.mc_compat = "~26.1"
required.fabric-api = "0.155.3+26.1.2"
required.fzzy_config = "0.7.6+26.1-pre-3"
optional.penchant = "0.5.5+mc26.1.2"
runtime.modmenu = "18.0.0"

[neoforge."26.1"]
mod.mc_compat = "[26.1, 26.2)"
required.fzzy_config = "0.7.6+26.1-pre-3+neoforge"


["26.2"]
